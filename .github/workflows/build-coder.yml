name: Build buzz-team-agent-coder

on:
  push:
    branches: [main]
    paths:
      - "images/coder/**"
  workflow_run:
    workflows: ["Build buzz-team-agent-base"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/coder
          platforms: linux/arm64
          push: true
          build-args: GHCR_OWNER=${{ github.repository_owner }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/buzz-team-agent-coder:latest
            ghcr.io/${{ github.repository_owner }}/buzz-team-agent-coder:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
