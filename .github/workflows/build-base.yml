name: Build buzz-team-agent-base

on:
  push:
    branches: [main]
    paths:
      - "images/base/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image owner
        run: echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/base
          platforms: linux/arm64
          push: true
          build-args: GHCR_OWNER=${{ env.GHCR_OWNER }}
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/buzz-team-agent-base:latest
            ghcr.io/${{ env.GHCR_OWNER }}/buzz-team-agent-base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
